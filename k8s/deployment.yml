apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepractice-deployment
  namespace: kubepractice
  labels:
    app: kubepractice
spec:
  strategy:
    type: RollingUpdate
  replicas: 2
  selector:
    matchLabels:
      app: kubepractice
  template:
    metadata:
      labels:
        app: kubepractice
    spec:
      containers:
      - name: kubepractice
        image: ghcr.io/ansalpandey/kubepractice:1.0.1-6b3dc4f
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3200
